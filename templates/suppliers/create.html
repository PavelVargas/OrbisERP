<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Proveedor | Sistema</title>
    <link rel="stylesheet" href="/static/css/order_css/supplier.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

    {% include 'layouts/left_bar.html' %}

    <main class="main">
        <div class="top-nav">
            <a href="{{ url_for('supplier_bp.supplier_list') }}" class="back-link">
                <i class="bi bi-chevron-left"></i> VOLVER AL LISTADO
            </a>
            <div class="user-meta">
                <i class="bi bi-truck"></i> Gestión de Suministros
            </div>
        </div>

        <header class="page-header">
            <div class="title-group">
                <h2>Crear Proveedor</h2>
                <p>Registra un nuevo contacto para tu cadena de suministro.</p>
            </div>
        </header>

        <div class="form-container-left" style="max-width: 600px;">
            <form method="POST" class="modern-form">
                <div class="form-group">
                    <label>Nombre del Proveedor</label>
                    <input type="text" name="name" placeholder="Ej. Distribuidora Global S.A." required>
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" placeholder="proveedor@empresa.com">
                </div>

                <div class="form-group">
                    <label>Teléfono de Contacto</label>
                    <input type="text" name="phone" placeholder="Ej. +1 809-000-0000">
                </div>

                <div class="form-actions-left" style="margin-top: 20px;">
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-save"></i> Guardar proveedor
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
