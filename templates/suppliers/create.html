<!DOCTYPE html>
<html lang="es" class="{% if tablet_mode_active|default(session.get('tablet_mode')) %}tablet-mode tablet-full-width-profile{% endif %}">
<head>{% set shell_assets_loaded = true %}{% include 'layouts/app_head_assets.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Proveedor | Sistema</title>
    <link rel="stylesheet" href="/static/css/order_css/supplier.css">


<link rel="stylesheet" href="{{ url_for('static', filename='css/orbis_refined.css', v='20260829-orange1') }}">
</head>
<body class="orbis-app">

    {% include 'layouts/left_bar.html' %}

    <main class="main">
        <div class="top-nav">
            <a href="{{ url_for('supplier_bp.supplier_list') }}" class="back-link">
                <i class="bi bi-chevron-left"></i> VOLVER AL LISTADO
            </a>
            <div class="user-meta">
                <i class="bi bi-truck"></i> Gestión de Suministros
            </div>
        </div>

        <header class="page-header">
            <div class="title-group">
                <h2>Crear Proveedor</h2>
                <p>Registra un nuevo contacto para tu cadena de suministro.</p>
            </div>
        </header>

        <div class="form-container-left" data-ui-style="rdc271cfe4e">
            <form method="POST" class="modern-form">
                <div class="form-group">
                    <label>Nombre del Proveedor</label>
                    <input type="text" name="name" placeholder="Ej. Distribuidora Global S.A." required>
                </div>

                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <input type="email" name="email" placeholder="proveedor@empresa.com">
                </div>

                <div class="form-group">
                    <label>Teléfono de Contacto</label>
                    <input type="text" name="phone" placeholder="Ej. +1 809-000-0000">
                </div>

                <div class="form-actions-left" data-ui-style="r5fa693f3d4">
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-save"></i> Guardar proveedor
                    </button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
