<!DOCTYPE html>
<html lang="es" data-orbis-seed-theme="{{ 'dark' if (request.cookies.get('orbis_theme') or session.get('theme')) == 'dark' else 'light' }}">
<head>{% include 'layouts/theme_prepaint.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción Vencida | OrbisERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base_css/base.css">
    <link rel="stylesheet" href="/static/css/superadmin_css/superadmin.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/orbis_refined.css', v='20260830-odoo19dark1') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/orbis_compact.css', v='20260830-odoo19dark1') }}">
</head>
<body class="master-theme orbis-public">

    <div class="theme-float">
        <button id="themeToggle" class="theme-switch">
            <i class="bi bi-sun-fill" id="themeIcon"></i>
            <span id="themeText">Modo Claro</span>
        </button>
    </div>

    <div class="lock-screen">
        <div class="lock-card">
            <div class="lock-icon"><i class="bi bi-clock-history"></i></div>
            <h1>Suscripción Vencida</h1>
            <p>El acceso a <strong>{{ company.name }}</strong> ha expirado. Realiza tu pago para restablecer el servicio.</p>
            
            <div class="bank-details">
                <p data-ui-style="r215b7c82c1"><i class="bi bi-bank"></i> BANRESERVAS</p>
                <code data-ui-style="rfb748c4250">9607606510</code>
                <small>Titular: ERIK PAVEL VARGAS GARCIA</small>
            </div>

            <form action="{{ url_for('company_bp.upload_receipt') }}" method="POST" enctype="multipart/form-data" class="upload-section">
                <div class="file-input-wrapper">
                    <label><i class="bi bi-camera-fill"></i> Sube tu comprobante (Foto o PDF)</label>
                    <input type="file" name="receipt" accept="image/*,.pdf" required>
                </div>
                <button type="submit" class="btn-pay">
                    <i class="bi bi-cloud-arrow-up-fill"></i> ACTIVAR 24H DE GRACIA
                </button>
            </form>

            <div data-ui-style="rd8152b1a39">
                <a href="https://wa.me/8494940074" target="_blank" rel="noopener" data-ui-style="ra459da896e">
                    <i class="bi bi-whatsapp"></i> Hablar con Soporte Técnico
                </a>
                <form method="post" action="{{ url_for('login_bp.logout') }}" data-ui-style="rcccfa4560d"><button type="submit" data-ui-style="r81c7c97945">
                    <i class="bi bi-door-open"></i> Cerrar Sesión
                </button></form>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/public-theme-toggle.js') }}" defer></script>
</body>
</html>
