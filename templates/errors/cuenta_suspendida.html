<!DOCTYPE html>
<html lang="es" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suscripción Vencida | OrbisERP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/base_css/base.css">
    <link rel="stylesheet" href="/static/css/superadmin_css/superadmin.css">
    <style>
        .lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-overlay, rgba(11, 15, 26, 0.98)); 
            display: flex; align-items: center; justify-content: center;
            z-index: 99999; backdrop-filter: blur(10px);
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        [data-theme="light"] .lock-screen { --bg-overlay: rgba(248, 250, 252, 0.95); }

        .lock-card {
            background: var(--card-bg, #151b2c); 
            border: 1px solid var(--border-color, #222d45);
            padding: 2.5rem; border-radius: 24px; text-align: center;
            max-width: 500px; box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        [data-theme="light"] .lock-card { 
            --card-bg: #ffffff; 
            --border-color: #e2e8f0;
            color: #1e293b;
        }

        .lock-icon {
            font-size: 3.5rem; color: #faa200; margin-bottom: 1rem;
            display: inline-block; animation: pulse 2s infinite;
        }

        .lock-card h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 0.5rem; color: var(--text-main, white); }
        [data-theme="light"] .lock-card h1 { --text-main: #0f172a; }

        .lock-card p { color: #64748b; line-height: 1.5; margin-bottom: 1.5rem; font-size: 0.95rem; }
        
        .upload-section {
            background: var(--bg-alt, rgba(255, 255, 255, 0.03));
            border: 1px solid var(--border-color, #222d45);
            border-radius: 16px; padding: 20px; margin-bottom: 1.5rem;
        }
        [data-theme="light"] .upload-section { --bg-alt: #f1f5f9; }

        .file-input-wrapper { margin-bottom: 15px; text-align: left; }
        .file-input-wrapper label { display: block; font-size: 0.8rem; color: #64748b; margin-bottom: 8px; font-weight: 600; }

        input[type="file"] { width: 100%; font-size: 0.8rem; color: #64748b; }
        input[type="file"]::file-selector-button {
            background: var(--btn-secondary, #222d45); color: white; border: none;
            padding: 8px 12px; border-radius: 8px; cursor: pointer;
        }
        [data-theme="light"] input[type="file"]::file-selector-button { --btn-secondary: #64748b; }

        .btn-pay {
            background: #faa200; color: #000; padding: 12px 30px;
            border-radius: 12px; text-decoration: none; font-weight: 800;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 10px; transition: 0.3s; width: 100%; border: none; cursor: pointer;
        }
        .btn-pay:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(250, 162, 0, 0.3); }
        
        .bank-details {
            font-size: 0.85rem; color: #faa200; margin-bottom: 15px;
            background: rgba(250, 162, 0, 0.1); padding: 10px; border-radius: 8px;
            text-align: left;
        }

        .theme-float { position: fixed; top: 20px; right: 20px; z-index: 100000; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body class="master-theme">

    <div class="theme-float">
        <button id="themeToggle" class="theme-switch">
            <i class="bi bi-sun-fill" id="themeIcon"></i>
            <span id="themeText">Modo Claro</span>
        </button>
    </div>

    <div class="lock-screen">
        <div class="lock-card">
            <div class="lock-icon"><i class="bi bi-clock-history"></i></div>
            <h1>Suscripción Vencida</h1>
            <p>El acceso a <strong>{{ company.name }}</strong> ha expirado. Realiza tu pago para restablecer el servicio.</p>
            
            <div class="bank-details">
                <p style="margin:0; font-weight: 800;"><i class="bi bi-bank"></i> BANRESERVAS</p>
                <code style="display:block; margin: 5px 0; font-size: 1rem; color: var(--text-main);">9607606510</code>
                <small>Titular: ERIK PAVEL VARGAS GARCIA</small>
            </div>

            <form action="{{ url_for('company_bp.upload_receipt') }}" method="POST" enctype="multipart/form-data" class="upload-section">
                <div class="file-input-wrapper">
                    <label><i class="bi bi-camera-fill"></i> Sube tu comprobante (Foto o PDF)</label>
                    <input type="file" name="receipt" accept="image/*,.pdf" required>
                </div>
                <button type="submit" class="btn-pay">
                    <i class="bi bi-cloud-arrow-up-fill"></i> ACTIVAR 24H DE GRACIA
                </button>
            </form>

            <div style="display: flex; flex-direction: column; gap: 15px;">
                <a href="https://wa.me/8494940074" target="_blank" style="color: #faa200; font-size: 0.85rem; text-decoration: none; font-weight: 600;">
                    <i class="bi bi-whatsapp"></i> Hablar con Soporte Técnico
                </a>
                <a href="{{ url_for('login_bp.logout') }}" style="color: #64748b; font-size: 0.8rem; text-decoration: none;">
                    <i class="bi bi-door-open"></i> Cerrar Sesión
                </a>
            </div>
        </div>
    </div>

    <script>
        const html = document.documentElement;
        const themeBtn = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        const themeText = document.getElementById('themeText');
        
        const updateUI = (isDark) => {
            if (isDark) {
                html.classList.add('dark');
                html.setAttribute('data-theme', 'dark');
                themeIcon.className = 'bi bi-sun-fill';
                themeText.innerText = 'Modo Claro';
            } else {
                html.classList.remove('dark');
                html.setAttribute('data-theme', 'light');
                themeIcon.className = 'bi bi-moon-stars-fill';
                themeText.innerText = 'Modo Oscuro';
            }
        };

        themeBtn.onclick = () => {
            const isDark = !html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            updateUI(isDark);
        };

        window.onload = () => {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            updateUI(savedTheme === 'dark');
        };
    </script>
</body>
</html>
