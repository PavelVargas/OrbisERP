<!DOCTYPE html><html lang="es" class="{% if session.get('theme') == 'dark' %}dark{% endif %}"><head>{% include 'layouts/theme_prepaint.html' %}<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acceso restringido · OrbisERP</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172033;font-family:'Plus Jakarta Sans',sans-serif}.dark body{background:#0d0f14;color:#f3f5f7}.denied{width:min(520px,calc(100% - 32px));padding:42px;text-align:center;border:1px solid rgba(128,128,128,.22);border-radius:24px;background:rgba(255,255,255,.8);box-shadow:0 25px 70px rgba(15,23,42,.12)}.dark .denied{background:#171a21}.icon{width:70px;height:70px;border-radius:22px;background:#fff0f1;color:#dc3545;display:grid;place-items:center;margin:auto;font-size:30px}h1{font-size:26px;margin:20px 0 8px}p{color:#7a8292;line-height:1.6}.actions{display:flex;justify-content:center;gap:9px;margin-top:25px}.actions a,.actions button{padding:11px 16px;border-radius:11px;text-decoration:none;font-weight:750;background:#f36b21;color:white}.actions a:last-child,.actions button{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.3)}</style><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"></head><body><section class="denied"><div class="icon"><i class="bi bi-shield-lock"></i></div><h1>No tienes acceso</h1><p>Tu cuenta no tiene el permiso necesario para ver este módulo o ejecutar esta operación. Solicita el acceso a un administrador.</p><div class="actions"><a href="{{ url_for('dashboard_bp.dashboard') }}">Ir al resumen</a><button id="permissionBack" type="button">Volver</button></div></section><script>document.getElementById('permissionBack')?.addEventListener('click',()=>{if(history.length>1)history.back();else location.href={{ url_for('dashboard_bp.dashboard')|tojson }};});</script></body></html>
