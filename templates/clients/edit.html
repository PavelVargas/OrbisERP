<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/client_css/client.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Editar Cliente</title>
</head>
<body>

    {% include 'layouts/left_bar.html' %}

    <main>
        <div class="top-nav">
            <a href="{{ url_for('client_bp.list_clients') }}" class="back-link">
                <i class="bi bi-arrow-left"></i> Volver al listado
            </a>
        </div>

        <div class="page-header">
            <div class="title-group">
                <h2>Editar Cliente</h2>
                <p>Modifica la información del perfil de <strong>{{ client.name }}</strong>.</p>
            </div>
        </div>

        <div class="table-card" style="padding: 40px; max-width: 600px;">
            <form method="POST">
                
                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--gray-text); margin-bottom: 8px;">
                        Nombre Completo *
                    </label>
                    <input type="text" name="name" class="form-control" value="{{ client.name }}" required
                           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); outline: none; font-family: inherit;">
                </div>

                <div class="form-group" style="margin-bottom: 20px;">
                    <label style="display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--gray-text); margin-bottom: 8px;">
                        Email
                    </label>
                    <input type="email" name="email" class="form-control" value="{{ client.email }}"
                           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); outline: none; font-family: inherit;">
                </div>

                <div class="form-group" style="margin-bottom: 35px;">
                    <label style="display: block; font-weight: 700; font-size: 12px; text-transform: uppercase; color: var(--gray-text); margin-bottom: 8px;">
                        Teléfono
                    </label>
                    <input type="text" name="phone" class="form-control" value="{{ client.phone }}"
                           style="width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg); color: var(--fg); outline: none; font-family: inherit;">
                </div>

                <div style="display: flex; gap: 15px; align-items: center;">
                    <button type="submit" class="btn-primary" style="border: none; cursor: pointer; font-family: 'Montserrat', sans-serif;">
                        <i class="bi bi-arrow-clockwise"></i> Actualizar Datos
                    </button>
                    
                    <a href="{{ url_for('client_bp.list_clients') }}" 
                       style="text-decoration: none; color: var(--gray-text); font-weight: 600; font-size: 14px; transition: 0.2s;">
                        Cancelar
                    </a>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
