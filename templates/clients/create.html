<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/client_css/create_client.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <title>Crear Cliente</title>
</head>
<body class="{% if session.get('theme') == 'dark' %}dark{% endif %}">

    {% include 'layouts/left_bar.html' %}

    <main class="main-wrapper">
        <div class="top-nav">
            <a href="{{ url_for('client_bp.list_clients') }}" class="back-link">
                <i class="bi bi-arrow-left"></i> VOLVER AL LISTADO
            </a>
        </div>

        <div class="form-container">
            <header class="page-header">
                <div class="title-group">
                    <h2>Nuevo Cliente</h2>
                    <p>Ingresa la información para dar de alta un nuevo perfil en el sistema.</p>
                </div>
            </header>

            <div class="form-card">
                <form method="POST">
                    <div class="form-group">
                        <label>Nombre Completo *</label>
                        <div class="input-wrapper">
                            <i class="bi bi-person"></i>
                            <input type="text" name="name" placeholder="Ej. Juan Pérez" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Correo Electrónico</label>
                        <div class="input-wrapper">
                            <i class="bi bi-envelope"></i>
                            <input type="email" name="email" placeholder="ejemplo@correo.com">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Teléfono de Contacto</label>
                        <div class="input-wrapper">
                            <i class="bi bi-telephone"></i>
                            <input type="text" name="phone" placeholder="809-000-0000">
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-save">
                            <i class="bi bi-cloud-check"></i> GUARDAR CLIENTE
                        </button>
                        
                        <a href="{{ url_for('client_bp.list_clients') }}" class="btn-cancel">
                            CANCELAR
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
