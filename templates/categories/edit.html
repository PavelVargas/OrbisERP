<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/category_css/category.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Editar Categoría</title>
</head>
<body>

    {% include "layouts/left_bar.html" %}
    
    <main>
        <div class="top-nav">
            <a href="/category" class="back-link">
                <i class="bi bi-arrow-left"></i> Volver a categorías
            </a>
        </div>

        <div class="page-header">
            <div class="title-group">
                <h2>Editar categoría</h2>
                <p>Estás modificando la categoría: <strong>{{ category.name }}</strong></p>
            </div>
        </div>

        <div class="category-card" style="max-width: 600px; cursor: default; transform: none !important; box-shadow: none;">
            <form method="post" class="modern-form">
                
                <div class="form-group">
                    <label for="name">Nombre de la Categoría</label>
                    <input 
                        type="text" 
                        id="name"
                        name="name" 
                        value="{{ category.name }}" 
                        placeholder="Ej. Electrónicos"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="description">Descripción</label>
                    <textarea 
                        id="description"
                        name="description" 
                        rows="5" 
                        placeholder="Describe de qué trata esta categoría..."
                    >{{ category.description }}</textarea>
                </div>

                <div class="card-footer" style="border: none; padding: 0; margin-top: 10px;">
                    <div style="display: flex; gap: 15px; align-items: center;">
                        <button id="save" type="submit" class="btn-primary">
                            <i class="bi bi-check-circle"></i> Actualizar Categoría
                        </button>
                        <a href="/category" style="text-decoration: none; color: var(--gray-text); font-weight: 600; font-size: 14px;">
                            Cancelar
                        </a>
                    </div>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
