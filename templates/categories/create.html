<!DOCTYPE html>
<html lang="es" class="{% if session.get('theme') == 'dark' %}dark{% endif %}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Categoría | OrbisERP</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/base_css/base.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/category_css/category.css') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="flex bg-[var(--bg-main)] text-[var(--text-main)]">
    
    {% include "layouts/left_bar.html" %}

    <main class="flex-grow h-screen overflow-y-auto p-4 lg:p-8">
        <nav class="flex items-center gap-4 mb-8">
            <a href="/category" class="text-[var(--text-muted)] hover:text-orbis transition-colors">
                <i class="bi bi-arrow-left-short text-2xl"></i>
            </a>
            <div>
                <span class="text-[10px] font-black uppercase tracking-[2px] text-orbis">Nuevo Registro</span>
                <h1 class="text-2xl font-800 tracking-tight">Crear Categoría</h1>
            </div>
        </nav>

        <div class="max-w-2xl">
            <div class="form-card-odoo">
                <form method="post" class="modern-form">
                    <div class="form-group">
                        <label>Nombre de la Categoría</label>
                        <input type="text" name="name" placeholder="Ej. Bebidas, Electrónica..." required>
                    </div>

                    <div class="form-group">
                        <label>Descripción (Opcional)</label>
                        <textarea name="description" rows="4" placeholder="Escribe una breve descripción..."></textarea>
                    </div>

                    <div class="flex items-center gap-6 mt-8">
                        <button type="submit" class="btn-primary-odoo">
                            <i class="bi bi-save-fill"></i> Guardar Categoría
                        </button>
                        <a href="/category" class="btn-cancel">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
