<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/category_css/category.css">
    <title>Crear categoría | Sistema</title>
</head>
<body>
    
    {% include "layouts/left_bar.html" %}

    <main>
        <div class="top-nav">
            <a href="/category" class="back-link">
                <i class="bi bi-chevron-left"></i> VOLVER AL LISTADO
            </a>
            <div class="user-meta">
                <i class="bi bi-tags"></i> Gestión de Inventario
            </div>
        </div>

        <header class="page-header">
            <div class="title-group">
                <h2>Crear Categoría</h2>
                <p>Organiza tus productos mediante etiquetas descriptivas.</p>
            </div>
        </header>

        <div class="form-container-left" style="max-width: 600px;">
            <form method="post" class="modern-form">
                <div class="form-group">
                    <label>Nombre de la Categoría</label>
                    <input type="text" name="name" placeholder="Ej. Bebidas, Electrónica..." required>
                </div>

                <div class="form-group">
                    <label>Descripción (Opcional)</label>
                    <textarea name="description" rows="4" placeholder="Escribe una breve descripción del tipo de productos en esta categoría..."></textarea>
                </div>

                <div class="form-actions-left" style="margin-top: 30px;">
                    <button id="save" type="submit" class="btn-primary">
                        <i class="bi bi-save"></i> Guardar Categoría
                    </button>
                </div>
            </form>
        </div>
    </main>

</body>
</html>
