<!DOCTYPE html>
<html lang="es" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Clave | OrbisERP</title>
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/login_css/login.css">
</head>
<body class="auth-page">

    <div class="bg-glow"></div>

    <header class="auth-nav">
        <a href="/" class="nav-logo">
            <i class="bi bi-intersect"></i>
            <span>Orbis<strong>ERP</strong></span>
        </a>
        <button id="themeToggle" class="theme-switch">
            <i class="bi bi-moon-stars-fill"></i>
            <span class="mode-text">Modo Oscuro</span>
        </button>
    </header>

    <main class="split-layout">
        <section class="side-visual">
            <div class="visual-content">
                <span class="pill-badge">Seguridad Orbis</span>
                <h1>Recupera tu <br><span class="text-gradient">Acceso.</span></h1>
                <p>No te preocupes, a todos nos pasa. Te enviaremos un correo para que vuelvas pronto.</p>
                
                <div class="mini-features">
                    <div class="m-item"><i class="bi bi-shield-check"></i> Encriptado</div>
                    <div class="m-item"><i class="bi bi-clock-history"></i> Rápido</div>
                </div>
            </div>
        </section>

        <section class="side-form">
            <div class="login-card">
                <div class="form-header">
                    <div style="margin-bottom: 20px;">
                        <i class="bi bi-shield-lock-fill" style="font-size: 3.5rem; color: var(--primary);"></i>
                    </div>
                    <h2>¿Olvidaste tu clave?</h2>
                    <p>Ingresa tu correo y te enviaremos un enlace de recuperación.</p>
                </div>

                <form action="{{ url_for('login_bp.forgot_password') }}" method="POST" class="modern-form">
                    <div class="form-grid">
                        <div class="field-group full">
                            <label><i class="bi bi-envelope"></i> Correo electrónico registrado</label>
                            <input type="email" name="email" placeholder="nombre@empresa.com" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-login-main">
                        <span>Enviar Enlace</span>
                        <i class="bi bi-send"></i>
                    </button>

                    <div class="links-footer">
                        <a href="{{ url_for('login_bp.login') }}">
                            <i class="bi bi-arrow-left"></i> Volver al <strong>Inicio de Sesión</strong>
                        </a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const btn = document.getElementById('themeToggle');
        const html = document.documentElement;

        // Sincronizar estado inicial del botón al cargar
        if (html.classList.contains('dark')) {
            btn.querySelector('i').className = 'bi bi-moon-stars-fill';
            btn.querySelector('.mode-text').innerText = 'Modo Oscuro';
        } else {
            btn.querySelector('i').className = 'bi bi-sun-fill';
            btn.querySelector('.mode-text').innerText = 'Modo Claro';
        }

        btn.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            btn.querySelector('i').className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            btn.querySelector('.mode-text').innerText = isDark ? 'Modo Oscuro' : 'Modo Claro';
        });
    </script>
</body>
</html>
