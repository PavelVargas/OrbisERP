<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | OrbisERP</title>
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/login_css/login.css">
</head>
<body class="auth-page">

    <div class="bg-glow"></div>

    <header class="auth-nav">
        <a href="/" class="nav-logo">
            <i class="bi bi-intersect"></i>
            <span>Orbis<strong>ERP</strong></span>
        </a>
        <button id="themeToggle" class="theme-switch">
            <i class="bi bi-moon-stars-fill"></i>
            <span class="mode-text">Modo Oscuro</span>
        </button>
    </header>

    <main class="split-layout">
        <section class="side-visual">
            <div class="visual-content">
                <span class="pill-badge">Sistemas Inteligentes</span>
                <h1>Bienvenido de <br><span class="text-gradient">Regreso.</span></h1>
                <p>Tu dashboard te espera con los reportes del día actualizados en tiempo real.</p>
                
                <div class="mini-features">
                    <div class="m-item"><i class="bi bi-fingerprint"></i> Seguro</div>
                    <div class="m-item"><i class="bi bi-activity"></i> En Vivo</div>
                </div>
            </div>
        </section>

        <section class="side-form">
            <div class="login-card">
                <div class="form-header">
                    <div class="login-icon-box" style="margin-bottom: 20px;">
                        <i class="bi bi-person-badge" style="font-size: 4rem; color: var(--primary);"></i>
                    </div>
                    <h2>Iniciar Sesión</h2>
                    <p>Introduce tus credenciales para continuar</p>
                </div>

                <form action="/login" method="POST" class="modern-form">
                    <div class="form-grid">
                        
                        <div class="field-group full">
                            <label><i class="bi bi-envelope"></i> Correo electrónico</label>
                            <div class="input-with-icon" style="position: relative;">
                                <i class="bi bi-person" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                                <input type="email" name="email" placeholder="nombre@empresa.com" required style="padding-left: 45px;">
                            </div>
                        </div>

                        <div class="field-group full">
                            <label><i class="bi bi-shield-lock"></i> Contraseña</label>
                            <div class="input-with-icon" style="position: relative;">
                                <i class="bi bi-key" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: var(--text-muted);"></i>
                                <input type="password" name="password" placeholder="••••••••" required style="padding-left: 45px;">
                            </div>
                        </div>

                    </div>

                    <button type="submit" class="btn-login-main">
                        <span>Entrar al Sistema</span>
                        <i class="bi bi-box-arrow-in-right"></i>
                    </button>

                    <div class="links-footer">
                        <a href="/register">¿Nuevo en Orbis? <strong>Crea una cuenta</strong></a>
                        <a href="{{ url_for('login_bp.forgot_password') }}" class="forgot-pass">¿Olvidaste tu contraseña?</a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const btn = document.getElementById('themeToggle');
        const html = document.documentElement;

        btn.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            btn.querySelector('i').className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            btn.querySelector('.mode-text').innerText = isDark ? 'Modo Oscuro' : 'Modo Claro';
        });
    </script>
</body>
</html>
