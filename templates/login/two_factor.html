<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Verificación · OrbisERP</title><link rel="stylesheet" href="{{ url_for('static',filename='css/login_css/login.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='css/public.css') }}"><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"></head>
<body class="auth-page"><div class="bg-glow"></div><main class="split-layout"><section class="side-visual"><div class="visual-content"><span class="pill-badge">Seguridad adicional</span><h1>Confirma que <span class="text-gradient">eres tú.</span></h1><p>Abre tu aplicación autenticadora y escribe el código actual.</p></div></section><section class="side-form"><div class="login-card"><div class="form-header"><div class="login-icon-box"><i class="bi bi-shield-lock" style="font-size:3rem;color:var(--primary)"></i></div><h2>Verificación en dos pasos</h2><p>El código cambia cada 30 segundos.</p></div><form method="post" class="modern-form"><div class="field-group full"><label>Código de 6 dígitos</label><input name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" placeholder="000000" required autofocus style="text-align:center;font-size:1.6rem;letter-spacing:.45rem"></div><button class="btn-login-main" type="submit"><span>Verificar acceso</span><i class="bi bi-arrow-right"></i></button></form></div></section></main></body></html>
