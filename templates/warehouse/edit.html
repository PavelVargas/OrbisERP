<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Almacén | OrbisERP</title>
    <link rel="stylesheet" href="/static/css/ware_css/edit_ware.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class=""> <script>
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
        }
    </script>

    {% include 'layouts/left_bar.html' %}

    <main class="main-content">
        <div class="top-nav">
            <a href="{{ url_for('dashboard_bp.dashboard') }}" class="back-link">
                <i class="bi bi-arrow-left"></i> VOLVER AL DASHBOARD
            </a>
        </div>

        <header class="page-header">
            <div class="title-group">
                <h2>Editar Almacén</h2>
                <p>Actualiza la información técnica y ubicación de la sede.</p>
            </div>
        </header>

        <div class="glass-form small-container">
            <form method="POST">
                <div class="form-group">
                    <label>Nombre del Almacén *</label>
                    <div class="input-with-icon">
                        <i class="bi bi-building"></i>
                        <input type="text" name="name" value="{{ warehouse.name }}" placeholder="Nombre del almacén" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ubicación Física</label>
                    <div class="input-with-icon">
                        <i class="bi bi-geo-alt"></i>
                        <input type="text" name="location" value="{{ warehouse.location }}" placeholder="Ej. Santo Domingo, DN">
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-save2"></i> GUARDAR CAMBIOS
                    </button>
                    <a href="{{ url_for('dashboard_bp.dashboard') }}" class="btn-secondary">
                        CANCELAR
                    </a>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
