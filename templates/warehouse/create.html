<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Almacén | Sistema</title>
    <link rel="stylesheet" href="/static/css/order_css/warestock.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body>

{% include 'layouts/left_bar.html' %}

<main>
    <div class="top-nav">
        <a href="{{ url_for('warehouse_bp.list_warehouses') }}" class="back-link">
            <i class="bi bi-chevron-left"></i> VOLVER A LISTADO
        </a>
        <div class="user-meta">
            <i class="bi bi-building-add"></i> Infraestructura
        </div>
    </div>

    <header class="page-header">
        <div class="title-group">
            <h2>Nuevo Almacén</h2>
            <p>Registra una nueva ubicación física para el control de inventarios.</p>
        </div>
    </header>

    <div class="form-container-left" style="max-width: 600px;">
        <form method="POST" action="{{ url_for('warehouse_bp.create_warehouse') }}" class="modern-form">
            
            <div class="form-group">
                <label>Nombre de la Instalación</label>
                <input 
                    type="text" 
                    name="name" 
                    placeholder="Ej. Almacén Central o Bodega Norte" 
                    required
                >
            </div>

            <div class="form-group">
                <label>Dirección / Ubicación</label>
                <input 
                    type="text" 
                    name="location" 
                    placeholder="Ej. Av. Principal #123, Sector Industrial"
                >
                <small class="hint">Referencia física para envíos y transferencias.</small>
            </div>

            <div class="form-actions-left" style="margin-top: 20px;">
                <button type="submit" class="btn-primary">
                    <i class="bi bi-plus-circle"></i> Crear almacén
                </button>
            </div>
        </form>
    </div>

</main>
</body>
</html>
