<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/static/css/order_css/order.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <title>Nueva Orden</title>
</head>
<body>
    {% include 'layouts/left_bar.html'%}
    
    <main>
        <div class="top-nav">
            <a href="{{ url_for('purchase_bp.purchase_list') }}" class="back-link">
                <i class="bi bi-chevron-left"></i> Volver a la lista
            </a>
            <div class="user-meta">
                <i class="bi bi-cart-plus"></i> Nueva Adquisición
            </div>
        </div>

        <section class="form-container-centered">
            <div class="setup-card">
                <div class="card-header-icon">
                    <i class="bi bi-truck"></i>
                </div>
                <h3>Nueva Orden de Compra</h3>
                <p style="color: var(--gray-text); font-size: 14px; margin-bottom: 25px;">
                    Selecciona el proveedor para iniciar el proceso.
                </p>

                <form method="post" class="modern-form">
                    <div class="form-group">
                        <label>Proveedor</label>
                        <select name="supplier_id" required>
                            <option value="" disabled selected>Elegir proveedor...</option>
                            {% for s in suppliers %}
                            <option value="{{ s.id }}">{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="form-info-box">
                        <i class="bi bi-info-circle"></i>
                        <p>Al hacer clic en "Crear Orden", pasarás a la pantalla de selección de productos.</p>
                    </div>

                    <button type="submit" class="btn-submit-full">
                        Crear Orden <i class="bi bi-arrow-right"></i>
                    </button>
                </form>
            </div>
        </section>
    </main>
</body>
</html>
