<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validator Pro | OrbisERP</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root { 
            --primary: #10b981; 
            --primary-glow: rgba(16, 185, 129, 0.4);
            --bg-dark: #070b14; 
            --bg-card: #111827; 
            --text-main: #f8fafc; 
            --text-muted: #64748b; 
            --danger: #ef4444; 
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { box-sizing: border-box; outline: none; }
        
        body { 
            margin: 0; 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-dark); 
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
            background-image: radial-gradient(circle at top right, rgba(16, 185, 129, 0.05), transparent);
        }

        main { flex-grow: 1; display: flex; flex-direction: column; padding: 15px; position: relative; }

        .odoo-toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 20px;
            margin-bottom: 20px;
        }

        .breadcrumb { font-size: 0.7rem; font-weight: 800; color: var(--text-muted); text-transform: uppercase; }
        .breadcrumb span { color: var(--primary); }

        .status-badge {
            background: var(--glass);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 0.65rem;
            font-weight: 900;
            border: 1px solid var(--glass-border);
        }

        .status-active { color: #ff7a2f; border-color: rgba(255, 122, 47, 0.3); }
        .status-complete { color: var(--primary); border-color: var(--primary); }

        .product-node {
            background: var(--bg-card);
            border-radius: 0px;
            color: var(--text-main);
            padding: 25px;
            position: relative;
            transition: transform 0.1s ease;
            overflow: hidden;
            border: 1px solid #dddddd33;
        }

        /* Efecto de golpe seco */
        .product-node.bump { transform: scale(1.02); }

        .sku-tag { 
            font-size: 0.7rem; 
            font-weight: 900; 
            background: #f1f5f9; 
            padding: 4px 12px; 
            border-radius: 8px; 
            color: var(--primary); 
            display: inline-block;
            margin-bottom: 10px;
        }

        .product-title { font-size: 1.4rem; font-weight: 900; line-height: 1.1; margin-bottom: 20px; }

        /* Barra SIN animación para respuesta instantánea */
        .progress-wrapper { height: 12px; background: var(--bg-input); border-radius: 20px; margin: 25px 0; overflow: hidden; }
        .progress-fill { 
            height: 100%; 
            background: var(--primary); 
            width: 0%; 
            /* Eliminada la transición para que sea instantáneo */
            transition: none; 
            box-shadow: 0 0 10px var(--primary-glow);
        }

        .counter-box { display: flex; align-items: baseline; justify-content: left; gap: 5px; }
        .qty-now { font-size: 6.5rem; font-weight: 900; color: var(--accent); letter-spacing: -5px; line-height: 1; }
        .qty-total { font-size: 2.2rem; font-weight: 700; color: #cbd5e1; }

        .route-path {
            background: var(--glass);
            border-radius: 20px;
            padding: 15px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .btn-validate {
            background: var(--primary);
            color: white;
            border: none;
            padding: 22px;
            border-radius: 20px;
            font-weight: 900;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 15px;
            display: none;
            cursor: pointer;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        #master-scanner { position: fixed; opacity: 0; pointer-events: none; }

        .scanner-idle {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .error-flash { animation: flashRed 0.2s; }
        .scan-guide { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:15px; }
        .scan-step { border:1px solid var(--glass-border); background:var(--glass); border-radius:14px; padding:12px; color:var(--text-muted); display:flex; align-items:center; gap:9px; font-size:.72rem; font-weight:800; }
        .scan-step i { font-size:1.15rem; }.scan-step.active{border-color:#ff7a2f;color:#ff7a2f}.scan-step.done{border-color:var(--primary);color:var(--primary)}
        .scanner-help{color:var(--text-muted);font-size:.78rem;text-align:center;margin:10px 0}.scanner-help strong{color:var(--text-main)}
        @media(max-width:700px){main{padding:10px}.scan-guide{grid-template-columns:1fr}.qty-now{font-size:4.5rem}.route-path{align-items:stretch;gap:8px}.product-node{padding:18px}}
        @keyframes flashRed { 
            50% { background-color: #450a0a; } 
        }
    </style>
</head>
<body>
    {% include 'layouts/left_bar.html' %}

    <main id="main-frame">
        <div class="odoo-toolbar">
            <div class="breadcrumb">ORBIS / <span id="mode-text">ESPERANDO SCAN</span></div>
            <div id="status-badge" class="status-badge">STANDBY</div>
        </div>

        <input type="text" id="master-scanner" autofocus autocomplete="off" inputmode="none">

        <div class="scan-guide">
            <div class="scan-step active" id="step-transfer"><i class="bi bi-file-earmark-bar-graph"></i><span>1. Conduce</span></div>
            <div class="scan-step" id="step-location"><i class="bi bi-geo-alt"></i><span>2. Ubicación destino</span></div>
            <div class="scan-step" id="step-product"><i class="bi bi-box-seam"></i><span>3. Productos</span></div>
        </div>

        <div id="transfer-details" style="display: none; flex-direction: column;">
            <div class="route-path">
                <div style="text-align: center; flex: 1;">
                    <span style="display:block; font-size:0.6rem; color:var(--text-muted); font-weight:800;">ORIGEN</span>
                    <span id="orig" style="font-weight:900;">---</span>
                </div>
                <i class="bi bi-arrow-right" style="color: var(--primary);"></i>
                <div style="text-align: center; flex: 1;">
                    <span style="display:block; font-size:0.6rem; color:var(--text-muted); font-weight:800;">DESTINO</span>
                    <span id="dest" style="font-weight:900;">---</span>
                </div>
            </div>

            <div class="product-node" id="product-card">
                <div class="sku-tag" id="display-ref">REF: ---</div>
                <div class="product-title" id="prod-name">Cargando datos...</div>

                <div class="progress-wrapper">
                    <div id="progress-bar" class="progress-fill"></div>
                </div>

                <div class="counter-box">
                    <span id="count-scanned" class="qty-now">0</span>
                    <span class="qty-total">/<span id="val-expected">0</span></span>
                </div>
            </div>
            <p class="scanner-help" id="scanner-help">Escanea el código solicitado para continuar.</p>

            <form id="confirm-form" method="POST">
                <button type="submit" class="btn-validate" id="btn-final">
                    <i class="bi bi-check-circle-fill"></i> VALIDAR Y CERRAR
                </button>
            </form>
        </div>

        <div id="empty-state" class="scanner-idle">
            <i class="bi bi-qr-code-scan" style="font-size: 5rem; color: var(--primary);"></i>
            <h2 style="margin-top: 20px; font-weight: 900;">MODO SCANNER</h2>
            <p style="color: var(--text-muted); font-weight: 600;">Escanee el código del conduce</p>
        </div>
    </main>

    <script>
        const scannerInput = document.getElementById('master-scanner');
        const transferDetails = document.getElementById('transfer-details');
        const emptyState = document.getElementById('empty-state');
        const statusBadge = document.getElementById('status-badge');
        const productCard = document.getElementById('product-card');
        const progressBar = document.getElementById('progress-bar');
        const mainFrame = document.getElementById('main-frame');
        
        let mode = 'WAITING_TRANSFER', currentTransfer = null, scannedQty = 0;
        let typingTimer;

        document.addEventListener('click', () => scannerInput.focus());
        setInterval(() => { if(document.activeElement !== scannerInput) scannerInput.focus(); }, 500);

        scannerInput.addEventListener('input', () => {
            clearTimeout(typingTimer);
            typingTimer = setTimeout(() => {
                const rawCode = scannerInput.value.trim();
                if (rawCode) { handleInput(rawCode); scannerInput.value = ''; }
            }, 50); // Reducido a 50ms para máxima velocidad
        });

        async function handleInput(code) {
            const cleanCode = code.toUpperCase().replace(/[^A-Z0-9]/g, "");

            if (mode === 'WAITING_TRANSFER') {
                try {
                    const res = await fetch(`/transfers/api/get_details/${cleanCode}`);
                    const data = await res.json();
                    if (data.success) {
                        currentTransfer = data.transfer;
                        renderUI();
                        mode = currentTransfer.destination_location_barcode ? 'WAITING_LOCATION' : 'WAITING_PRODUCT';
                        statusBadge.innerText = "EN CURSO";
                        statusBadge.classList.add('status-active');
                        setStep(mode === 'WAITING_LOCATION' ? 'location' : 'product');
                        document.getElementById('scanner-help').innerHTML = mode === 'WAITING_LOCATION' ? '<strong>Escanea ahora la etiqueta de la ubicación destino.</strong>' : '<strong>Escanea cada unidad del producto.</strong>';
                        beep(600, 0.1);
                    } else { triggerError(); }
                } catch (e) { triggerError(); }
            } 
            else if (mode === 'WAITING_LOCATION') {
                const expectedLocation = (currentTransfer.destination_location_barcode || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
                if (cleanCode === expectedLocation) {
                    mode = 'WAITING_PRODUCT';
                    setStep('product');
                    document.getElementById('scanner-help').innerHTML = '<strong>Ubicación validada.</strong> Escanea cada unidad del producto.';
                    beep(720, 0.08);
                } else { triggerError('La ubicación escaneada no es el destino de este traslado.'); }
            }
            else if (mode === 'WAITING_PRODUCT') {
                const cleanSku = (currentTransfer.product_sku || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
                const isMatch = (cleanCode === cleanSku || cleanCode === String(currentTransfer.product_id));
                
                // VALIDACIÓN: Solo sumar si el código coincide Y no hemos llegado al límite
                if (isMatch && scannedQty < currentTransfer.expected_qty) {
                    scannedQty++;
                    updateCounter();
                    bumpEffect();
                    beep(800, 0.05);
                } else {
                    // Si intenta escanear más de la cuenta o el código está mal
                    triggerError('El producto no coincide o la cantidad ya está completa.'); 
                }
            }
        }

        function renderUI() {
            emptyState.style.display = 'none';
            transferDetails.style.display = 'flex';
            document.getElementById('display-ref').innerText = "REF: " + currentTransfer.ref_code;
            document.getElementById('orig').innerText = currentTransfer.origin_location ? `${currentTransfer.origin} · ${currentTransfer.origin_location}` : currentTransfer.origin;
            document.getElementById('dest').innerText = currentTransfer.destination_location ? `${currentTransfer.destination} · ${currentTransfer.destination_location}` : currentTransfer.destination;
            document.getElementById('prod-name').innerText = currentTransfer.product_name;
            document.getElementById('val-expected').innerText = currentTransfer.expected_qty;
        }

        function updateCounter() {
            document.getElementById('count-scanned').innerText = scannedQty;
            
            // Cambio instantáneo de la barra
            const progress = (scannedQty / currentTransfer.expected_qty) * 100;
            progressBar.style.width = progress + "%";

            if (scannedQty >= currentTransfer.expected_qty) {
                document.getElementById('btn-final').style.display = 'block';
                document.getElementById('confirm-form').action = `/transfers/receive/${currentTransfer.id}`;
                statusBadge.innerText = "COMPLETO";
                statusBadge.className = "status-badge status-complete";
                document.getElementById('scanner-help').innerHTML = '<strong>Conteo completo.</strong> Confirma para registrar el stock y la trazabilidad.';
            }
        }

        function setStep(active) {
            ['transfer','location','product'].forEach((name, index) => {
                const el = document.getElementById(`step-${name}`);
                el.classList.toggle('active', name === active);
                const order = {transfer:0,location:1,product:2};
                el.classList.toggle('done', order[name] < order[active] || (name === 'location' && !currentTransfer?.destination_location_barcode));
            });
            document.getElementById('mode-text').innerText = active === 'location' ? 'VALIDAR UBICACIÓN' : active === 'product' ? 'CONTAR PRODUCTOS' : 'ESPERANDO CONDUCE';
        }

        function bumpEffect() {
            productCard.classList.add('bump');
            setTimeout(() => productCard.classList.remove('bump'), 100);
        }

        function triggerError(message = 'Código no reconocido.') {
            mainFrame.classList.add('error-flash');
            setTimeout(() => mainFrame.classList.remove('error-flash'), 200);
            beep(150, 0.4); // Sonido de error más grave
            if(navigator.vibrate) navigator.vibrate([100, 50, 100]);
            const help = document.getElementById('scanner-help');
            if (help) { const previous = help.innerHTML; help.innerHTML = `<strong style="color:var(--danger)">${message}</strong>`; setTimeout(() => help.innerHTML = previous, 1800); }
        }

        function beep(freq, duration) {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            osc.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }
    </script>
</body>
</html>
