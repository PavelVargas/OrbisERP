<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro | OrbisERP</title>
    
    <script>
        (function() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        })();
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/registro_css/registro.css">
</head>
<body class="auth-page">

    <div class="bg-glow"></div>

    <header class="auth-nav">
        <a href="/" class="nav-logo">
            <i class="bi bi-intersect"></i>
            <span>Orbis<strong>ERP</strong></span>
        </a>
        <button id="themeToggle" class="theme-switch">
            <i class="bi bi-moon-stars-fill"></i>
            <span class="mode-text">Modo Oscuro</span>
        </button>
    </header>

    <main class="split-layout">
        <section class="side-visual">
            <div class="visual-content">
                <span class="pill-badge">Únete a la Red</span>
                <h1>Tu carrera <br><span class="text-gradient">Empieza Aquí.</span></h1>
                <p>Accede a la plataforma de gestión más intuitiva del mercado. Control total en la palma de tu mano.</p>
                
                <div class="mini-features">
                    <div class="m-item"><i class="bi bi-person-check"></i> Perfil Único</div>
                    <div class="m-item"><i class="bi bi-lightning-charge"></i> Acceso Instantáneo</div>
                </div>
            </div>
        </section>

        <section class="side-form">
            <div class="register-card">
                <div class="form-header">
                    <h2>Crea tu cuenta</h2>
                    <p>Únete a la nueva era de gestión empresarial</p>
                </div>

                <form action="/register" method="POST" class="modern-form">
                    <div class="form-grid">
                        
                        <div class="field-group full">
                            <label><i class="bi bi-person"></i> Nombre Completo</label>
                            <input type="text" name="name" placeholder="Ej. Juan Pérez" required>
                        </div>

                        <div class="field-group full">
                            <label><i class="bi bi-envelope"></i> Correo Electrónico</label>
                            <input type="email" name="email" placeholder="juan@ejemplo.com" required>
                        </div>

                        <div class="field-group full">
                            <label><i class="bi bi-card-text"></i> Cédula / ID</label>
                            <input type="text" name="cedula" placeholder="000-0000000-0" required>
                        </div>

                        <div class="field-group full">
                            <label><i class="bi bi-lock"></i> Contraseña</label>
                            <input type="password" name="password" placeholder="••••••••" required>
                        </div>

                    </div>

                    <button type="submit" class="btn-register-main">
                        <span>Empezar ahora</span>
                        <i class="bi bi-chevron-right"></i>
                    </button>

                    <div class="login-redirect">
                        ¿Ya eres parte de Orbis? <a href="/login"><strong>Inicia sesión</strong></a>
                    </div>
                </form>
            </div>
        </section>
    </main>

    <script>
        const btn = document.getElementById('themeToggle');
        const html = document.documentElement;

        btn.addEventListener('click', () => {
            const isDark = html.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            btn.querySelector('i').className = isDark ? 'bi bi-moon-stars-fill' : 'bi bi-sun-fill';
            btn.querySelector('.mode-text').innerText = isDark ? 'Modo Oscuro' : 'Modo Claro';
        });
    </script>
</body>
</html>
