<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración de Usuario | OrbisERP</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/users_css/create_user.css">
</head>
<body class="admin-panel">
    <script>
        if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
    </script>

    {% include "layouts/left_bar.html" %}
    
    <main class="main-content">
        <header class="page-header-integrated">
            <div class="header-left">
                <nav class="breadcrumb-nav">
                    <a href="/users">Usuarios</a>
                    <i class="bi bi-chevron-right"></i>
                    <span>Nuevo Registro</span>
                </nav>
                <h2>Añadir Colaborador</h2>
            </div>
            
            <div class="header-right">
                <div class="status-badge">
                    <span class="dot pulse"></span> Sesión de Administrador
                </div>
            </div>
        </header>

        <form action="/create_user" method="post" class="form-grid-layout">
            
            <div class="column">
                <section class="config-card">
                    <div class="card-header">
                        <i class="bi bi-person-bounding-box"></i>
                        <div class="card-title">
                            <h3>Perfil de Identidad</h3>
                            <p>Información básica del trabajador</p>
                        </div>
                    </div>

                    <div class="input-stack">
                        <div class="field-group">
                            <label>Nombre y Apellidos</label>
                            <div class="input-box">
                                <i class="bi bi-person"></i>
                                <input type="text" name="name" placeholder="Ej. Carlos Mendoza" required>
                            </div>
                        </div>

                        <div class="field-group">
                            <label>Correo Institucional</label>
                            <div class="input-box">
                                <i class="bi bi-envelope"></i>
                                <input type="email" name="email" placeholder="c.mendoza@orbis.com" required>
                            </div>
                        </div>

                        <div class="field-group">
                            <label>Cedula</label>
                            <div class="input-box">
                                <i class="bi bi-envelope"></i>
                                <input type="text" name="cedula" placeholder="001-5468640-3" required>
                            </div>
                        </div>

                        <div class="field-group">
                            <label>Contraseña Maestra</label>
                            <div class="input-box">
                                <i class="bi bi-lock"></i>
                                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
                                <button type="button" class="btn-toggle-view" onclick="togglePass()">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </section>
            </div>

            <div class="column">
                <section class="config-card">
                    <div class="card-header">
                        <i class="bi bi-shield-lock"></i>
                        <div class="card-title">
                            <h3>Control de Acceso</h3>
                            <p>Nivel de permisos y sede</p>
                        </div>
                    </div>

                    <div class="input-stack">
                        <div class="field-group">
                            <label>Nivel de Autoridad</label>
                            <div class="input-box">
                                <i class="bi bi-key"></i>
                                <select name="role" required>
                                    <option value="user">Usuario Estándar (Lectura/Escritura)</option>
                                    <option value="admin">Administrador (Control Total)</option>
                                </select>
                            </div>
                        </div>

                        <div class="field-group">
                            <label>Almacén / Centro de Costos</label>
                            <div class="input-box">
                                <i class="bi bi-geo-alt"></i>
                                <select name="warehouse_id">
                                    <option value="">Seleccionar ubicación...</option>
                                    {% for wh in warehouses %}
                                        <option value="{{ wh.id }}">{{ wh.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>

                        <div class="switch-field">
                            <div class="switch-label">
                                <strong>Activar cuenta inmediatamente</strong>
                                <span>Permitir acceso al guardar</span>
                            </div>
                            <label class="apple-switch">
                                <input type="checkbox" checked name="is_active">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>
                </section>

                <div class="action-bar">
                    <a href="/users" class="btn-cancel">Descartar</a>
                    <button type="submit" class="btn-primary">
                        <i class="bi bi-cloud-arrow-up"></i> Registrar Colaborador
                    </button>
                </div>
            </div>
        </form>
    </main>

    <script>
        function togglePass() {
            const p = document.getElementById('password');
            const i = document.querySelector('.btn-toggle-view i');
            p.type = p.type === "password" ? "text" : "password";
            i.classList.toggle('bi-eye');
            i.classList.toggle('bi-eye-slash');
        }
    </script>
</body>
</html>
