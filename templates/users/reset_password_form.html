<!DOCTYPE html>
<html lang="es" data-theme="dark" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Acceso | OrbisERP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #0f172a;
            --card-bg: #151b2c;
            --accent: #faa200;
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border: rgba(255, 255, 255, 0.08);
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-deep);
            font-family: 'Plus Jakarta Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
            overflow: hidden;
        }

        /* Fondo Decorativo */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(250, 162, 0, 0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: -1;
        }

        .reset-container {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 28px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            text-align: center;
        }

        .logo-area {
            font-size: 2.5rem;
            color: var(--accent);
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }

        p {
            color: var(--text-dim);
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 2rem;
        }

        .form-group {
            text-align: left;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            margin-bottom: 8px;
            color: var(--accent);
            letter-spacing: 0.5px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-dim);
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--accent);
            background: rgba(0, 0, 0, 0.4);
            box-shadow: 0 0 0 4px rgba(250, 162, 0, 0.1);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 15px -3px rgba(250, 162, 0, 0.3);
        }

        .footer-link {
            margin-top: 1.5rem;
            display: block;
            color: var(--text-dim);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 500;
            transition: 0.3s;
        }

        .footer-link:hover {
            color: white;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>

    <div class="reset-container">
        <div class="logo-area">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Nueva Contraseña</h1>
        <p>Estás a un paso de recuperar el acceso a tu nodo en <strong>OrbisERP</strong>.</p>

        <form method="POST">
            <div class="form-group">
                <label for="password">Contraseña Nueva</label>
                <div class="input-wrapper">
                    <i class="bi bi-key-fill"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                ACTUALIZAR CREDENCIALES <i class="bi bi-arrow-right-short"></i>
            </button>
        </form>

        <a href="{{ url_for('login_bp.login') }}" class="footer-link">
            <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
        </a>
    </div>
</body>
</html>
