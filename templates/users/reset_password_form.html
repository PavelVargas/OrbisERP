<!DOCTYPE html>
<html lang="es">
<head>{% include 'layouts/theme_prepaint.html' %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Acceso | OrbisERP</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/orbis_refined.css', v='20260829-orange1') }}">
</head>
<body class="orbis-public">
    <div class="bg-glow"></div>

    <div class="reset-container">
        <div class="logo-area">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1>Nueva Contraseña</h1>
        <p>Estás a un paso de recuperar el acceso a tu nodo en <strong>OrbisERP</strong>.</p>

        <form method="POST">
            <div class="form-group">
                <label for="password">Contraseña Nueva</label>
                <div class="input-wrapper">
                    <i class="bi bi-key-fill"></i>
                    <input type="password" name="password" id="password" placeholder="••••••••" required minlength="6">
                </div>
            </div>

            <button type="submit" class="btn-submit">
                ACTUALIZAR CREDENCIALES <i class="bi bi-arrow-right-short"></i>
            </button>
        </form>

        <a href="{{ url_for('login_bp.login') }}" class="footer-link">
            <i class="bi bi-arrow-left"></i> Volver al inicio de sesión
        </a>
    </div>
</body>
</html>
