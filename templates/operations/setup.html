<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Configuración inicial · OrbisERP</title><link rel="stylesheet" href="{{ url_for('static',filename='css/operations.css') }}"></head><body>{% include 'layouts/left_bar.html' %}<main class="ops-page"><a class="ops-back" href="{{ url_for('dashboard_bp.dashboard') }}">← Volver al resumen</a><header class="ops-hero"><span>CONFIGURACIÓN GUIADA</span><h1>Deja tu empresa lista para operar</h1><p>Completa los datos esenciales. Podrás modificarlos después desde Mi empresa.</p></header><form method="post" class="ops-card ops-form"><div class="ops-progress"><i>1</i><b>Empresa</b><span></span><i>2</i><b>Almacén</b><span></span><i>3</i><b>Listo</b></div><div class="ops-grid"><label><span>Nombre comercial *</span><input name="name" value="{{ company.name }}" required maxlength="150"></label><label><span>RNC</span><input name="rnc" value="{{ company.rnc or '' }}" maxlength="20"></label><label><span>Correo</span><input type="email" name="email" value="{{ company.email or '' }}" maxlength="120"></label><label><span>Teléfono</span><input name="phone" value="{{ company.phone or '' }}" maxlength="20"></label><label class="wide"><span>Dirección</span><textarea name="address" rows="3">{{ company.address or '' }}</textarea></label><label class="wide"><span>Nombre del almacén principal</span><input name="warehouse_name" placeholder="Ej. Almacén principal"><small>Solo se creará si todavía no tienes almacenes.</small></label></div><footer><button type="submit">Completar configuración <i>→</i></button></footer></form></main></body></html>
