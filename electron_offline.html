<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>OrbisERP · Reconectando</title>
  <meta http-equiv="refresh" content="3">
  <style>
    :root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#152033;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(520px,100%);background:#fff;border:1px solid #dde5ef;border-radius:20px;padding:32px;box-shadow:0 18px 60px rgba(26,41,66,.12);text-align:center}
    .mark{width:54px;height:54px;margin:0 auto 18px;border-radius:16px;background:#152033;color:white;display:grid;place-items:center;font-size:24px;font-weight:800}
    h1{margin:0 0 8px;font-size:25px}p{margin:0;color:#64748b;line-height:1.6}.pulse{display:inline-flex;gap:5px;margin-top:22px}.pulse i{width:7px;height:7px;border-radius:50%;background:#64748b;animation:p 1.2s infinite alternate}.pulse i:nth-child(2){animation-delay:.2s}.pulse i:nth-child(3){animation-delay:.4s}@keyframes p{to{opacity:.2;transform:translateY(-3px)}}
  </style>
</head>
<body>
  <main>
    <div class="mark">O</div>
    <h1>Conectando con OrbisERP</h1>
    <p>El servicio local todavía no responde. Esta pantalla vuelve a intentarlo automáticamente cada pocos segundos.</p>
    <div class="pulse" aria-label="Reconectando"><i></i><i></i><i></i></div>
  </main>
</body>
</html>
