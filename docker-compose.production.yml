services:
  web:
    build: .
    restart: unless-stopped
    env_file: .env
    ports: ["127.0.0.1:8000:8000"]
    volumes:
      - uploads:/app/static/uploads
      - logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/operations/health/ready"]
      interval: 30s
      timeout: 5s
      retries: 5
volumes:
  uploads:
  logs:
